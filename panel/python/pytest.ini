[pytest]
testpaths = tests
# Domyslne przechwytywanie wyjscia na poziomie deskryptorow ("fd") potrafi
# na Windowsie wywrocic tworzenie kolejnego okna Tk ("Can't find a usable
# tk.tcl") - testy ida z przechwytywaniem na poziomie sys. Bez katalogu
# .pytest_cache w repozytorium.
addopts = --capture=sys -p no:cacheprovider
